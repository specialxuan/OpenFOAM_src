<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">新增内部面非正交性示意图</title>
  <desc id="desc">仿射六面体中，内部面的面积矢量与相邻子单元中心连线分别按面积和长度比例缩放，夹角保持。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#d35400"/>
    </marker>
    <style>
      .cellA { fill:#eaf4fb; stroke:#203040; stroke-width:2.4; }
      .cellB { fill:#fff4e6; stroke:#203040; stroke-width:2.4; }
      .face { stroke:#1d6fa5; stroke-width:4.2; }
      .center { fill:#111827; }
      .dvec { stroke:#d35400; stroke-width:3; marker-end:url(#arrowOrange); fill:none; }
      .svec { stroke:#1d6fa5; stroke-width:3; marker-end:url(#arrowBlue); fill:none; }
      .edge { stroke:#203040; stroke-width:2.4; fill:none; }
      .dash { stroke:#7f8c8d; stroke-width:1.6; stroke-dasharray:7 5; fill:none; }
      .label { font: 18px sans-serif; fill:#17202a; }
      .small { font: 15px sans-serif; fill:#2f3a45; }
      .caption { font: 21px sans-serif; font-weight:700; fill:#17202a; }
      .formula { font: 19px sans-serif; fill:#263238; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="44" y="48" class="caption">仿射六面体中新内部面的非正交性</text>

  <!-- Two adjacent skewed child cells in 2D projection -->
  <polygon class="cellA" points="132,330 332,330 388,190 188,190"/>
  <polygon class="cellB" points="332,330 532,330 588,190 388,190"/>
  <path class="face" d="M332,330 L388,190"/>
  <path class="dash" d="M232,260 L444,260"/>

  <circle class="center" cx="250" cy="260" r="5"/>
  <circle class="center" cx="450" cy="260" r="5"/>
  <text x="213" y="286" class="small">c_own</text>
  <text x="457" y="248" class="small">c_nei</text>

  <path class="dvec" d="M250,260 L450,260"/>
  <text x="335" y="246" class="label">d</text>

  <!-- Normal vector from face midpoint -->
  <path class="svec" d="M360,260 L456,298"/>
  <text x="474" y="312" class="label">S_int</text>

  <!-- Angle arc -->
  <path d="M407,260 A48,48 0 0 1 404,278" stroke="#8e44ad" stroke-width="2.2" fill="none"/>
  <text x="414" y="278" class="label">θ</text>

  <text x="136" y="372" class="small">左子单元</text>
  <text x="428" y="372" class="small">右子单元</text>

  <rect x="650" y="120" width="270" height="250" rx="6" fill="#f7f9fb" stroke="#d0d7de"/>
  <text x="674" y="158" class="formula">S_int = 1/4 (e_eta x e_zeta)</text>
  <text x="674" y="198" class="formula">d = 1/2 e_xi</text>
  <text x="674" y="252" class="formula">cos(theta)</text>
  <text x="674" y="282" class="formula">= |S_int · d| / (|S_int| |d|)</text>
  <text x="674" y="332" class="small">面积和长度缩放会抵消，夹角保持</text>
</svg>
